name: Relay test (temporary)

on:
  workflow_dispatch:
    inputs:
      hop:
        description: "hop number"
        type: string
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  first:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      at: ${{ steps.pick.outputs.at }}
    steps:
      - id: pick
        run: |
          echo "hop ${{ inputs.hop }} at $(date -u +%FT%TZ)"
          echo "env=studio-wait-test" >> "$GITHUB_OUTPUT"
          echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
  relay:
    needs: first
    if: ${{ needs.first.outputs.env != '' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.first.outputs.env }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          echo "relay started $(( $(date +%s) - ${{ needs.first.outputs.at }} )) seconds after the first job"
          if [ "${{ inputs.hop }}" = "0" ]; then
            gh workflow run relay-test.yml --repo "$GITHUB_REPOSITORY" -f hop=1
            echo "dispatched hop 1"
          fi
