name: Studio Instagram

# The GRCSAC Studio Instagram (@grcsac_studio), published straight through Meta's
# API by ig_studio.py: two posts a day, every day, at 11:00 and 19:00 New York
# time, and no item is ever posted twice. Slots already filled by a post
# scheduled in Meta Business Suite are skipped (content/studio_schedule.json).
# See STUDIO-SCHEDULING.md.

on:
  schedule:
    # GitHub starts this repository's scheduled runs late, by anything from
    # twenty minutes to seven hours, and drops some. So the workflow keeps its
    # own time: each run ends by parking a job on a delay timer that starts
    # the next run just before the next slot (job "relay" below). These hourly
    # lines are only the safety net: they start that chain if it ever stops,
    # and a run that starts after a slot nobody filled posts straight away.
    # Six lines rather than one, in case a late line only ever yields one run.
    - cron: "7 0,6,12,18 * * *"
    - cron: "7 1,7,13,19 * * *"
    - cron: "7 2,8,14,20 * * *"
    - cron: "7 3,9,15,21 * * *"
    - cron: "7 4,10,16,22 * * *"
    - cron: "7 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render + print, do not publish or advance)"
        type: boolean
        default: false
      check_only:
        description: "Only check the token and account, then stop"
        type: boolean
        default: false
      probe:
        description: "Ask Meta to accept every video and one card, publish nothing"
        type: boolean
        default: false
      rehearse:
        description: "Item ids, comma separated: render, host and have Meta accept them, publish nothing"
        type: string
        default: ""
      health_only:
        description: "Only report whether Meta's API accepts the token (never fails, publishes nothing)"
        type: boolean
        default: false
      as_scheduled:
        description: "Act like a scheduled run: post only into a due, free slot, sleep if one is minutes away, and book the next run"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write        # the relay job starts the next run

jobs:
  # Sleeps until the slot when one is at most 45 minutes away. It only delays:
  # it holds no lock, so a health check or a rehearsal started meanwhile is not
  # kept waiting, and whatever happens here the gate in the next job decides.
  wait:
    if: ${{ github.event_name == 'schedule' || inputs.as_scheduled }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AS_SCHEDULED: ${{ (github.event_name == 'workflow_dispatch' && inputs.as_scheduled) && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: How long until the next free slot?
        id: plan
        run: python ig_studio.py wait

      - name: Wait for the slot
        if: ${{ steps.plan.outputs.seconds != '' && steps.plan.outputs.seconds != '0' }}
        run: sleep ${{ steps.plan.outputs.seconds }}

  run:
    needs: wait
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: social-autopilot
      cancel-in-progress: false
    outputs:
      relay_env: ${{ steps.relay.outputs.env }}
      relay_minutes: ${{ steps.relay.outputs.minutes }}
      relay_at: ${{ steps.relay.outputs.at }}
    env:
      AS_SCHEDULED: ${{ (github.event_name == 'workflow_dispatch' && inputs.as_scheduled) && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      IG_STUDIO_TOKEN: ${{ secrets.IG_STUDIO_TOKEN }}
      IG_STUDIO_TOKEN_KEY: ${{ secrets.IG_STUDIO_TOKEN_KEY }}
      IG_STUDIO_USER_ID: ${{ vars.IG_STUDIO_USER_ID }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
      REHEARSE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Is there a free slot right now?
        id: gate
        run: python ig_studio.py gate

      - name: Health (is the API accepting the token)
        if: ${{ inputs.health_only }}
        run: python ig_studio.py health

      - name: Check token and account
        if: ${{ steps.gate.outputs.go == 'true' && env.DRY_RUN != '1' && !inputs.health_only }}
        run: python ig_studio.py check

      - name: Probe (Meta fetches the media, nothing is published)
        if: ${{ steps.gate.outputs.go == 'true' && inputs.probe && !inputs.health_only }}
        run: python ig_studio.py probe

      - name: Render the next post
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: python ig_studio.py build

      - name: Publish image (commit -> jsDelivr serves it)
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add public/cards
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "studio: publish card image ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      - name: Post to Instagram
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: python ig_studio.py publish

      - name: Note a failed scheduled run (the next ones hold off)
        if: ${{ failure() && steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.as_scheduled) && env.DRY_RUN != '1' && env.REHEARSE == '' }}
        run: python ig_studio.py failed

      - name: Save ledger, state and refreshed token
        if: ${{ always() && steps.gate.outputs.go == 'true' }}
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add content/state.json content/studio_schedule.json
          [ -f content/ig_studio_token.enc ] && git add content/ig_studio_token.enc
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "studio: record post ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      - name: Which timer brings the next run in?
        id: relay
        if: ${{ always() && (github.event_name == 'schedule' || (inputs.as_scheduled && !inputs.dry_run && !inputs.check_only && !inputs.probe && !inputs.health_only && inputs.rehearse == '')) }}
        run: python ig_studio.py relay

  # The workflow's own clock. The environment named by the job above
  # (studio-wait-30 ... studio-wait-900) has a wait timer of that many minutes,
  # set in the repository's settings; GitHub holds this job for that long
  # without using a runner, and then it starts the next run. If the timer did
  # not hold (the environment was removed or changed), nothing is started, so
  # this can never turn into a loop of runs starting each other.
  relay:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.relay_env != '' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.run.outputs.relay_env }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next run
        run: |
          waited=$(( $(date +%s) - ${{ needs.run.outputs.relay_at }} ))
          need=$(( ${{ needs.run.outputs.relay_minutes }} * 48 ))
          echo "held for $waited seconds on ${{ needs.run.outputs.relay_env }}"
          if [ "$waited" -lt "$need" ]; then
            echo "::warning::The wait timer on ${{ needs.run.outputs.relay_env }} did not hold ($waited s). No run started; see STUDIO-SCHEDULING.md."
            exit 0
          fi
          gh workflow run studio.yml --repo "$GITHUB_REPOSITORY" --ref main -f as_scheduled=true
