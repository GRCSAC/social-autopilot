name: Studio Instagram

# The GRCSAC Studio Instagram (@grcsac_studio), published straight through Meta's
# API by ig_studio.py: two posts a day, every day, at 11:00 and 19:00 New York
# time, and no item is ever posted twice. Slots already filled by a post
# scheduled in Meta Business Suite are skipped (content/studio_schedule.json).
# See STUDIO-SCHEDULING.md.

on:
  schedule:
    # Every day, three runs around each slot. 11:00 New York is 16:00 UTC in
    # winter and 15:00 UTC in summer; 19:00 New York is 00:00 or 23:00 UTC.
    # `ig_studio.py gate` lets the first run at or after the slot post, and the
    # later ones only if that slot is still empty, so a failed or dropped run
    # is retried within the hour. Minute 7 keeps clear of GitHub's busy hour mark.
    - cron: "7 15,16,17 * * *"
    - cron: "7 23,0,1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render + print, do not publish or advance)"
        type: boolean
        default: false
      check_only:
        description: "Only check the token and account, then stop"
        type: boolean
        default: false
      probe:
        description: "Ask Meta to accept every video and one card, publish nothing"
        type: boolean
        default: false
      rehearse:
        description: "Item ids, comma separated: render, host and have Meta accept them, publish nothing"
        type: string
        default: ""
      health_only:
        description: "Only report whether Meta's API accepts the token (never fails, publishes nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      IG_STUDIO_TOKEN: ${{ secrets.IG_STUDIO_TOKEN }}
      IG_STUDIO_TOKEN_KEY: ${{ secrets.IG_STUDIO_TOKEN_KEY }}
      IG_STUDIO_USER_ID: ${{ vars.IG_STUDIO_USER_ID }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
      REHEARSE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Is there a free slot right now?
        id: gate
        run: python ig_studio.py gate

      - name: Health (is the API accepting the token)
        if: ${{ inputs.health_only }}
        run: python ig_studio.py health

      - name: Check token and account
        if: ${{ steps.gate.outputs.go == 'true' && env.DRY_RUN != '1' && !inputs.health_only }}
        run: python ig_studio.py check

      - name: Probe (Meta fetches the media, nothing is published)
        if: ${{ steps.gate.outputs.go == 'true' && inputs.probe && !inputs.health_only }}
        run: python ig_studio.py probe

      - name: Render the next post
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: python ig_studio.py build

      - name: Publish image (commit -> jsDelivr serves it)
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add public/cards
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "studio: publish card image ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      - name: Post to Instagram
        if: ${{ steps.gate.outputs.go == 'true' && !inputs.check_only && !inputs.probe && !inputs.health_only }}
        run: python ig_studio.py publish

      - name: Save ledger, state and refreshed token
        if: ${{ always() && steps.gate.outputs.go == 'true' }}
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add content/state.json content/studio_schedule.json
          [ -f content/ig_studio_token.enc ] && git add content/ig_studio_token.enc
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "studio: record post ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi
