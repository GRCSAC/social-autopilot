name: Studio Instagram

# PARKED. The studio Instagram is scheduled natively in Meta Business Suite (see
# STUDIO-SCHEDULING.md), because Meta's API needs a developer account and that
# needs a Facebook account. This workflow is the direct-API route, kept for the day
# a token exists: it has no schedule and only runs by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render + print, do not publish or advance)"
        type: boolean
        default: false
      check_only:
        description: "Only check the token and account, then stop"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      IG_STUDIO_TOKEN: ${{ secrets.IG_STUDIO_TOKEN }}
      IG_STUDIO_TOKEN_KEY: ${{ secrets.IG_STUDIO_TOKEN_KEY }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check token and account
        if: ${{ env.DRY_RUN != '1' }}
        run: python ig_studio.py check

      - name: Render the next card
        if: ${{ !inputs.check_only }}
        run: python ig_studio.py build

      - name: Publish image (commit -> jsDelivr serves it)
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add public/cards
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "studio: publish card image ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      - name: Post to Instagram
        if: ${{ !inputs.check_only }}
        run: python ig_studio.py publish

      - name: Save cursor and refreshed token
        if: always()
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add content/state.json
          [ -f content/ig_studio_token.enc ] && git add content/ig_studio_token.enc
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "studio: advance cursor / refresh token ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi
