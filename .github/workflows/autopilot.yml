name: Social Autopilot

# Runs weekly (Sunday 14:00 UTC ≈ 10am ET). Each run queues one week of posts to
# Buffer, which then publishes them on the Mon/Wed/Fri schedule. You can also run
# it by hand from the Actions tab — tick "dry_run" to test without posting.

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + print Buffer calls, do not post or advance)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build batch (render Instagram cards)
        run: python run.py build

      - name: Publish images (commit -> Cloudflare Pages serves them)
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add public/cards
          if git diff --cached --quiet; then
            echo "No new images to publish."
          else
            git commit -m "autopilot: publish card images ($(date -u +%F))"
            git push
          fi

      - name: Queue posts to Buffer
        run: python run.py post

      - name: Save rotation state
        if: env.DRY_RUN != '1'
        run: |
          git config user.name  "social-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add content/state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "autopilot: advance rotation ($(date -u +%F))"
            git push
          fi
